  function ResponsiveContainer({children,height=200}){
    const ref=React.useRef(); const [w,setW]=React.useState(500);

  function AreaChart({data=[],children,__w=400,__h=200}){
    const mg={t:10,r:20,b:28,l:48}; const W=__w-mg.l-mg.r; const H=__h-mg.t-mg.b; const n=data.length;
    const areas=[],lines=[],xAx=[],yAx=[],grids=[];
    React.Children.forEach(children,c=>{if(!c)return; const t=c.type?.name;
      if(t==='Area')areas.push(c); if(t==='Line')lines.push(c);
      if(t==='XAxis')xAx.push(c); if(t==='YAxis')yAx.push(c); if(t==='CartesianGrid')grids.push(c); });
    const allKeys=[...areas,...lines].map(x=>x.props.dataKey);
    let yMn=Infinity,yMx=-Infinity;
    allKeys.forEach(k=>data.forEach(d=>{const v=d[k]; if(v!=null&&!isNaN(v)){yMn=Math.min(yMn,v);yMx=Math.max(yMx,v);}}));
    if(!isFinite(yMn)){yMn=0;yMx=100;} yMn=Math.min(0,yMn);
    const Xp=i=>sc(i,0,n-1,0,W); const Yp=v=>H-sc(v??0,yMn,yMx,0,H);
    const xKey=xAx[0]?.props?.dataKey||'name';
    const yTks=Array.from({length:5},(_,i)=>yMn+(yMx-yMn)*i/4);
    const fmtY=yAx[0]?.props?.tickFormatter||(v=>v>=1000?`$${Math.round(v/1000)}k`:v);
    const colors=['#6366f1','#10b981','#f59e0b','#ef4444','#3b82f6'];
    const mkPath=(k,areaClose)=>{let p='',s=false; data.forEach((d,i)=>{const v=d[k]; if(v==null){s=false;return;}
      p+=s?`L${Xp(i)},${Yp(v)} `:`M${Xp(i)},${Yp(v)} `; s=true;});
      if(areaClose){const fi=data.findIndex(d=>d[k]!=null); const li=[...data].map((d,i)=>({i,v:d[k]})).filter(x=>x.v!=null).pop();
        if(li)p+=`L${Xp(li.i)},${H} L${Xp(fi)},${H} Z`;}
      return p;};

      <defs>{areas.map((a,i)=>{const c=a.props.stroke||colors[i];return <linearGradient key={i} id={`ag${i}`} x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor={c} stopOpacity={0.2}/><stop offset="95%" stopColor={c} stopOpacity={0}/></linearGradient>;})} </defs>
      {grids.length>0&&yTks.map((v,i)=><line key={i} x1={0} y1={Yp(v)} x2={W} y2={Yp(v)} stroke="#f1f5f9" strokeDasharray="3,3"/>)}
      {areas.map((a,i)=>{const k=a.props.dataKey,c=a.props.stroke||colors[i],d=a.props.strokeDasharray||'none';

      {lines.map((l,i)=>{const k=l.props.dataKey,c=l.props.stroke||colors[i+areas.length],d=l.props.strokeDasharray||'none';
        return <path key={i} d={mkPath(k,false)} fill="none" stroke={c} strokeWidth={l.props.strokeWidth||1.5} strokeDasharray={d}/>;})}

      {data.map((d,i)=>i%skip===0||i===n-1?<text key={i} x={Xp(i)} y={H+16} textAnchor="middle" fontSize={11} fill="#94a3b8">{d[xKey]??i}</text>:null)}
      {yTks.map((v,i)=><text key={i} x={-6} y={Yp(v)+4} textAnchor="end" fontSize={11} fill="#94a3b8">{fmtY(Math.round(v))}</text>)}
    </g></svg>;
  }
  const LineChart=AreaChart;
  function BarChart({data=[],children,__w=400,__h=200,layout='horizontal'}){
    const mg={t:10,r:20,b:layout==='horizontal'?32:10,l:layout==='vertical'?108:48};
    const W=__w-mg.l-mg.r; const H=__h-mg.t-mg.b; const n=data.length;
    const bars=[],xAx=[],yAx=[];
    React.Children.forEach(children,c=>{if(!c)return; const t=c.type?.name;
      if(t==='Bar')bars.push(c); if(t==='XAxis')xAx.push(c); if(t==='YAxis')yAx.push(c);});
    const allV=[]; bars.forEach(b=>data.forEach(d=>{const v=d[b.props.dataKey]; if(v!=null)allV.push(v);}));
    const vMx=Math.max(...allV,1);

      {layout==='vertical'&&data.map((d,di)=>{const slH=H/n,bH=slH*0.65/bc,y0=slH*di+slH*0.175;
        return <g key={di}>{bars.map((b,bi)=>{const v=d[b.props.dataKey]??0,bW=(v/vMx)*W,c=b.props.fill||colors[bi%colors.length],rx=b.props.radius?b.props.radius[1]||4:0;

          <text x={-6} y={y0+slH*0.325+4} textAnchor="end" fontSize={10} fill="#94a3b8">{d[catKey]??di}</text></g>;})}
      {layout==='horizontal'&&<line x1={0} y1={H} x2={W} y2={H} stroke="#e2e8f0"/>}
      {layout==='vertical'&&<line x1={0} y1={0} x2={0} y2={H} stroke="#e2e8f0"/>}
    </g></svg>;
  }
  function PieChart({children,__w=300,__h=200}){
    const pies=[]; React.Children.forEach(children,c=>{if(c?.type?.name==='Pie')pies.push(c);});
    const cx=__w/2,cy=__h/2;
    return <svg width={__w} height={__h}>{pies.map((pie,pi)=>{
      const{data=[],innerRadius=0,outerRadius=Math.min(cx,cy)*0.85,dataKey='value',paddingAngle=0}=pie.props;
      const total=data.reduce((s,d)=>s+(d[dataKey]||0),0);

      let ang=-Math.PI/2;

        const val=d[dataKey]||0,sweep=(val/(total||1))*2*Math.PI;
        const c=cells[i]?.props?.fill||d.color||['#6366f1','#0ea5e9','#f59e0b','#10b981','#94a3b8'][i%5];

        const x2=cx+outerRadius*Math.cos(ang+sweep),y2=cy+outerRadius*Math.sin(ang+sweep);
        const ix1=cx+innerRadius*Math.cos(ang+sweep),iy1=cy+innerRadius*Math.sin(ang+sweep);
        const ix2=cx+innerRadius*Math.cos(ang),iy2=cy+innerRadius*Math.sin(ang);
        const lg=sweep>Math.PI?1:0;
        const path=innerRadius>0
          ?`M${x1},${y1} A${outerRadius},${outerRadius} 0 ${lg} 1 ${x2},${y2} L${ix1},${iy1} A${innerRadius},${innerRadius} 0 ${lg} 0 ${ix2},${iy2} Z`
          :`M${cx},${cy} L${x1},${y1} A${outerRadius},${outerRadius} 0 ${lg} 1 ${x2},${y2} Z`;
        ang+=sweep+(paddingAngle*Math.PI/180);
        return <path key={i} d={path} fill={c}/>;
      })}</g>;})}</svg>;

function IAModule() {
  const [tab, setTab] = useState('chat');

  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const chatRef = useRef(null);

  const IA_RESPONSES = {
    default: { texto:'Basándome en el marco normativo vigente y la jurisprudencia aplicable, le puedo indicar que esta materia está regulada por las disposiciones del Estatuto Tributario Nacional y los Acuerdos municipales. Para una respuesta más precisa, le recomiendo contrastar con el análisis de brechas del Módulo 1.', fuentes:['Estatuto Tributario Nacional','Ley 1437/2011'] },
    ica: { texto:'El Impuesto de Industria y Comercio (ICA) en su municipio está regulado por el Acuerdo 012 de 2009, el cual presenta una brecha crítica con la Ley 1819/2016. Específicamente, el Artículo 345 de la Ley 1819 modificó la base gravable para servicios financieros, estableciendo que será el promedio mensual de activos. El impacto estimado de esta brecha no actualizada asciende a $1.240 millones de pesos anuales.', fuentes:['Ley 1819/2016 Art. 345','Ley 2277/2022 Art. 84','Acuerdo Municipal 012/2009'] },
    predial: { texto:'El impuesto Predial Unificado está sujeto a los límites del Artículo 6° de la Ley 44 de 1990, modificado por la Ley 1995 de 2019. Las tarifas deben oscilar entre el 1 por mil y el 16 por mil del avalúo catastral. Para inmuebles rurales, la Ley 2381/2024 (MFMP) introdujo criterios de diferenciación que su municipio aún no ha incorporado.', fuentes:['Ley 44/1990 Art. 6','Ley 1995/2019','Ley 2381/2024'] },
    cobro: { texto:'El proceso de cobro coactivo municipal se rige por los Artículos 823 a 843 del Estatuto Tributario y la Ley 1066 de 2006. El mandamiento de pago es el acto que da inicio formal al proceso. Según los datos de su municipio, el cobro coactivo tiene una eficiencia del 58%, siendo el acuerdo de pago el procedimiento más eficiente con un 84%.', fuentes:['E.T. Art. 823-843','Ley 1066/2006','Circular DIAN 012/2026'] },
  };

  const getResponse = (q) => {
    const ql = q.toLowerCase();
    if (ql.includes('ica') || ql.includes('industria')) return IA_RESPONSES.ica;
    if (ql.includes('predial') || ql.includes('catastro') || ql.includes('rural')) return IA_RESPONSES.predial;
    if (ql.includes('cobro') || ql.includes('coactivo') || ql.includes('proceso')) return IA_RESPONSES.cobro;
    return IA_RESPONSES.default;
  };

  const sendMessage = () => {
    if (!input.trim()) return;
    const userMsg = { rol:'user', texto:input };
    setMessages(m=>[...m, userMsg]);
    setInput('');
    setLoading(true);
    setTimeout(()=>{
      const resp = getResponse(input);
      setMessages(m=>[...m, { rol:'ai', ...resp }]);
      setLoading(false);
    }, 1400);

            className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${tab===t.id?'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm':'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
            <Icon d={icons[t.icon]} size={14}/>{t.label}
          </button>
        ))}
      </div>

      {tab === 'chat' && (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <Card className="lg:col-span-2 flex flex-col" style={{height:'520px'}}>
            <div className="p-4 border-b border-slate-100 dark:border-slate-700 flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center text-indigo-600">
                <Icon d={icons.cpu} size={14}/>
              </div>
              <div>
                <div className="text-sm font-semibold text-slate-800 dark:text-white">Asistente Normativo SRIPT</div>
                <div className="flex items-center gap-1.5 text-xs text-emerald-500">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse-dot"/>En línea
                </div>
              </div>
            </div>
            <div ref={chatRef} className="flex-1 p-4 overflow-y-auto space-y-4">
              {messages.map((m,i)=>(
                <div key={i} className={`flex ${m.rol==='user'?'justify-end':'justify-start'}`}>
                  <div className={`max-w-[85%] ${m.rol==='user'?'chat-bubble-user':'chat-bubble-ai dark:text-white'} p-3 text-sm`}>
                    {m.texto}
                    {m.fuentes && m.fuentes.length > 0 && (
                      <div className="mt-2 pt-2 border-t border-slate-100 dark:border-slate-600 space-y-1">
                        {m.fuentes.map((f,j)=>(
                          <div key={j} className="flex items-center gap-1 text-xs text-indigo-500 dark:text-indigo-400">
                            <Icon d={icons.link} size={10}/>

                          </div>

                      </div>

                  </div>
                </div>
              ))}
              {loading && (
                <div className="flex justify-start">
                  <div className="chat-bubble-ai dark:text-white p-3 flex items-center gap-2">
                    {[0,1,2].map(i=>(
                      <span key={i} className="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-500 animate-pulse-dot" style={{animationDelay:`${i*0.2}s`}}/>

            <div className="p-4 border-t border-slate-100 dark:border-slate-700 flex gap-2">

            <h4 className="text-sm font-semibold text-slate-700 dark:text-slate-300">Preguntas frecuentes</h4>

// ─── SIMULADOR DE IMPACTO ─────────────────────────────────────────────────────
function SimuladorImpacto() {
  const BASE = 7380;
  const [ajustes, setAjustes] = useState({ ica:0, predial:0, delineacion:0, alumbrado:0 });
  const [eficienciaCobro, setEficienciaCobro] = useState(65);
  const [fiscalizacion, setFiscalizacion] = useState(40);

  const maxImpacto = { ica:1240, predial:870, delineacion:420, alumbrado:190 };
  const totalAjuste = Object.entries(ajustes).reduce((acc,[k,v])=> acc + Math.round(maxImpacto[k]*v/100), 0);
  const impactoEficiencia = Math.round((eficienciaCobro - 65) * 18);
  const impactoFisc = Math.round((fiscalizacion - 40) * 12);
  const totalProyectado = BASE + totalAjuste + impactoEficiencia + impactoFisc;
  const variacion = ((totalProyectado - BASE) / BASE * 100).toFixed(1);

  const sliders = [
    { key:'ica', label:'ICA — Ajuste base gravable', max:maxImpacto.ica, color:'bg-indigo-500', light:'bg-indigo-100 dark:bg-indigo-900/30' },
    { key:'predial', label:'Predial — Actualización tarifas rurales', max:maxImpacto.predial, color:'bg-sky-500', light:'bg-sky-100 dark:bg-sky-900/30' },
    { key:'delineacion', label:'Delineación Urbana — Hecho generador', max:maxImpacto.delineacion, color:'bg-violet-500', light:'bg-violet-100 dark:bg-violet-900/30' },
    { key:'alumbrado', label:'Alumbrado Público — Metodología CREG', max:maxImpacto.alumbrado, color:'bg-amber-500', light:'bg-amber-100 dark:bg-amber-900/30' },
  ];

  return (
    <div className="space-y-5 animate-fade-in">
      <div className="bg-gradient-to-br from-indigo-600 to-violet-600 rounded-2xl p-5 text-white">
        <div className="text-xs font-semibold uppercase tracking-wide opacity-75 mb-1">Recaudo Proyectado (Simulación)</div>
        <div className="text-4xl font-bold mb-1">${totalProyectado.toLocaleString('es-CO')}M COP</div>
        <div className={`text-sm font-medium ${variacion >= 0 ? 'text-emerald-300' : 'text-red-300'}`}>
          {variacion >= 0 ? '+' : ''}{variacion}% vs. recaudo real 2025 (${BASE.toLocaleString('es-CO')}M)
        </div>
        <div className="mt-3 grid grid-cols-3 gap-3">
          <div className="bg-white/10 rounded-xl p-3 text-center">
            <div className="text-lg font-bold">${totalAjuste.toLocaleString('es-CO')}M</div>
            <div className="text-xs opacity-75">Armonización normativa</div>
          </div>
          <div className="bg-white/10 rounded-xl p-3 text-center">
            <div className="text-lg font-bold">${Math.max(0,impactoEficiencia).toLocaleString('es-CO')}M</div>
            <div className="text-xs opacity-75">Eficiencia de cobro</div>
          </div>
          <div className="bg-white/10 rounded-xl p-3 text-center">
            <div className="text-lg font-bold">${Math.max(0,impactoFisc).toLocaleString('es-CO')}M</div>
            <div className="text-xs opacity-75">Fiscalización</div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div className="space-y-4">
          <h4 className="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
            <Icon d={icons.scale} size={14} className="text-indigo-500"/>
            Impacto por Ajuste Normativo
          </h4>
          {sliders.map(s=>(
            <div key={s.key} className={`p-4 rounded-xl ${s.light}`}>
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-medium text-slate-700 dark:text-slate-300">{s.label}</span>
                <span className="text-xs font-bold text-slate-800 dark:text-white">
                  +${Math.round(maxImpacto[s.key]*ajustes[s.key]/100).toLocaleString('es-CO')}M
                </span>
              </div>

          { label:'Leídas', value:alertas.filter(a=>a.leida).length, color:'text-emerald-600', bg:'bg-emerald-50 dark:bg-emerald-900/20' },
        ].map((k,i)=>(
          <Card key={i} className={`p-4 ${k.bg}`}>
            <div className="text-xs text-slate-500 mb-1 font-medium">{k.label}</div>
            <div className={`text-3xl font-bold ${k.color}`}>{k.value}</div>
          </Card>
        ))}
      </div>

      <div className="flex gap-2 flex-wrap">
        {['todas','nuevas','critica','alta','media','baja'].map(f=>(
          <button key={f} onClick={()=>setFiltro(f)}
            className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all capitalize ${filtro===f?'bg-indigo-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-600'}`}>
            {f === 'todas' ? 'Todas' : f === 'nuevas' ? 'No leídas' : f.charAt(0).toUpperCase()+f.slice(1)}
          </button>
        ))}
      </div>

      <div className="space-y-3">
        {filtradas.map(a=>(
          <div key={a.id} className={`border-l-4 rounded-r-xl p-4 ${colorAlerta[a.tipo]} ${a.leida?'opacity-70':''}`}>
            <div className="flex items-start justify-between gap-4">
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  {!a.leida && <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse-dot"/>}
                  <Badge label={a.tipo.charAt(0).toUpperCase()+a.tipo.slice(1)} color={badgeAlerta[a.tipo]}/>
                  <span className="text-xs text-slate-400">{a.fecha}</span>
                </div>
                <h4 className="font-semibold text-slate-800 dark:text-white text-sm mb-1">{a.titulo}</h4>
                <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed mb-2">{a.descripcion}</p>
                <div className="flex flex-wrap gap-1">
                  {a.afecta.map((af,i)=>(
                    <span key={i} className="text-xs bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full">
                      Afecta: {af}
                    </span>
                  ))}
                </div>
              </div>
              <div className="flex flex-col gap-2 shrink-0">
                {!a.leida && (
                  <button onClick={()=>marcarLeida(a.id)}
                    className="flex items-center gap-1 px-3 py-1.5 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-xs text-slate-600 dark:text-slate-400 hover:border-indigo-300 transition-all">
                    <Icon d={icons.check} size={11}/>Marcar leída
                  </button>
                )}
                <button className="flex items-center gap-1 px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs hover:bg-indigo-700 transition-all">
                  <Icon d={icons.zap} size={11}/>Ir a Brecha
                </button>
              </div>
            </div>
          </div>
        ))}
        {filtradas.length === 0 && (
          <div className="text-center py-12 text-slate-400">
            <Icon d={icons.bell} size={32} className="mx-auto mb-3 opacity-30"/>
            <p className="text-sm">No hay alertas para este filtro</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── APP SHELL ────────────────────────────────────────────────────────────────
function App() {
  const [dark, setDark] = useState(false);
  const [module, setModule] = useState('dashboard');
  const [search, setSearch] = useState('');
  const [sidebarOpen, setSidebarOpen] = useState(true);

  useEffect(()=>{
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  const navItems = [
    { id:'dashboard', label:'Panel General', icon:'home' },
    { id:'normativa', label:'Gestión Normativa', icon:'book' },
    { id:'ia', label:'IA y Aprendizaje', icon:'cpu' },
    { id:'analitica', label:'Analítica de Impacto', icon:'chart' },
    { id:'gobernanza', label:'Gobernanza y Alertas', icon:'shield' },
  ];

  const alertasNuevas = ALERTAS.filter(a=>!a.leida).length;

  const renderModule = () => {
    if (module==='dashboard') return <Dashboard setModule={setModule}/>;
    if (module==='normativa') return <NormativaModule/>;
    if (module==='ia') return <IAModule/>;
    if (module==='analitica') return <AnaliticaModule/>;
    if (module==='gobernanza') return <GobernanzaModule/>;
    return null;
  };

  return (
    <div className={`flex h-screen bg-slate-50 dark:bg-slate-900 overflow-hidden`}>
      {/* Sidebar */}
      <aside className={`${sidebarOpen?'w-60':'w-16'} shrink-0 bg-slate-900 dark:bg-slate-950 flex flex-col transition-all duration-300 overflow-hidden`}>
        {/* Logo */}
        <div className="p-4 border-b border-slate-800">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0">
              <Icon d={icons.scale} size={16} className="text-white"/>
            </div>
            {sidebarOpen && (
              <div>
                <div className="text-white font-bold text-sm leading-tight">SRIPT</div>
                <div className="text-slate-400 text-xs leading-tight">Gov. Territorial</div>
              </div>
            )}
          </div>
        </div>

        {/* Navigation */}
        <nav className="flex-1 p-2 space-y-1 mt-2">
          {navItems.map(item=>(
            <button key={item.id} onClick={()=>setModule(item.id)}
              className={`nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition-all ${module===item.id?'active':'text-slate-400 hover:text-slate-200'}`}>
              <Icon d={icons[item.icon]} size={17} className={module===item.id?'text-indigo-400':''}/>
              {sidebarOpen && (
                <span className={`text-sm font-medium ${module===item.id?'text-white':'text-slate-400'}`}>{item.label}</span>
              )}
              {item.id==='gobernanza' && alertasNuevas > 0 && (
                <span className={`${sidebarOpen?'ml-auto':'absolute left-8 top-1'} w-4 h-4 bg-red-500 rounded-full text-white text-xs flex items-center justify-center font-bold`}>
                  {alertasNuevas}
                </span>
              )}
            </button>
          ))}
        </nav>

        {/* Bottom */}
        <div className="p-3 border-t border-slate-800">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-full bg-indigo-700 flex items-center justify-center text-white text-xs font-bold shrink-0">JM</div>
            {sidebarOpen && (
              <div className="min-w-0">
                <div className="text-sm font-medium text-slate-300 truncate">Juan Martínez</div>
                <div className="text-xs text-slate-500 truncate">Secretario Hacienda</div>
              </div>
            )}
          </div>
        </div>
      </aside>

      {/* Main */}
      <div className="flex-1 flex flex-col overflow-hidden">
        {/* Header */}
        <header className="h-14 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center px-4 gap-4 shrink-0">
          <button onClick={()=>setSidebarOpen(s=>!s)}
            className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-all">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>

          <div className="flex-1 max-w-md relative">
            <Icon d={icons.search} size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Buscar normas, brechas, conceptos..."
              className="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white"/>
          </div>

          <div className="ml-auto flex items-center gap-3">
            <button className="relative text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-all" onClick={()=>setModule('gobernanza')}>
              <Icon d={icons.bell} size={18}/>
              {alertasNuevas > 0 && <span className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-white text-xs flex items-center justify-center font-bold">{alertasNuevas}</span>}
            </button>
            <button onClick={()=>setDark(d=>!d)}
              className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-all">
              <Icon d={dark ? icons.sun : icons.moon} size={17}/>
            </button>
            <div className="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-xs font-bold">JM</div>
          </div>
        </header>

        {/* Content */}
        <main className="flex-1 overflow-y-auto p-6">
          <div className="max-w-6xl mx-auto">
            {renderModule()}
          </div>
        </main>

        {/* Footer */}
        <footer className="h-8 bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700 flex items-center px-6 shrink-0">
          <span className="text-xs text-slate-400">SRIPT v1.0 — Servicio Regulatorio Integrado para Gobiernos Territoriales · CONSISA 2026</span>
          <span className="ml-auto text-xs text-slate-400">Municipio: Zipaquirá, Cundinamarca</span>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
